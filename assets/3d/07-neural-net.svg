<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="240">
  <defs>
    <linearGradient id="nnBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080c16"/>
      <stop offset="100%" stop-color="#04060d"/>
    </linearGradient>
    <filter id="nnGlow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
  </defs>
  <rect width="400" height="240" rx="8" fill="url(#nnBg)" stroke="#1e293b"/>
  <text x="14" y="22" font-family="monospace" font-size="9" font-weight="bold" fill="#F472B6">[DEMO 07] 3D NEURAL SYNAPSE NETWORK</text>
  <text x="315" y="22" font-family="monospace" font-size="8" fill="#F472B6">● AI BRAIN</text>
  <line x1="14" y1="30" x2="386" y2="30" stroke="#1e293b"/>

  <!-- Rotating 3D Constellation -->
  <g>
    <!-- Synaptic Connection lines -->
    <line x1="150" y1="105" x2="240" y2="95" stroke="#475569" stroke-width="1"/>
    <line x1="150" y1="105" x2="190" y2="170" stroke="#475569" stroke-width="1"/>
    <line x1="240" y1="95" x2="260" y2="160" stroke="#475569" stroke-width="1"/>
    <line x1="190" y1="170" x2="260" y2="160" stroke="#475569" stroke-width="1"/>
    <line x1="200" y1="135" x2="150" y2="105" stroke="#00E5FF" stroke-width="1.2" opacity="0.8"/>
    <line x1="200" y1="135" x2="260" y2="160" stroke="#F472B6" stroke-width="1.2" opacity="0.8"/>

    <!-- Pulses travelling along axons -->
    <circle cx="200" cy="135" r="3" fill="#ffffff" filter="url(#nnGlow)">
      <animate attributeName="cx" values="150;240;260;200" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="105;95;160;135" dur="3s" repeatCount="indefinite"/>
    </circle>

    <!-- 3D Nodes (Size depth based on oscillation) -->
    <circle cx="150" cy="105" r="6" fill="#38BDF8">
      <animate attributeName="r" values="6;8;4;6" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="240" cy="95" r="7" fill="#818CF8">
      <animate attributeName="r" values="7;4;8;7" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="190" cy="170" r="5" fill="#EC4899">
      <animate attributeName="r" values="5;7;4;5" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="260" cy="160" r="8" fill="#10B981">
      <animate attributeName="r" values="8;5;7;8" dur="4s" repeatCount="indefinite"/>
    </circle>

    <!-- Central Super Node -->
    <circle cx="200" cy="135" r="11" fill="#00E5FF" filter="url(#nnGlow)">
      <animate attributeName="r" values="9;13;9" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="200" y="139" font-family="sans-serif" font-size="8" font-weight="900" fill="#080c16" text-anchor="middle">AI</text>
  </g>

  <text x="200" y="215" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="middle">ON-DEVICE TFLite • REALTIME SYNAPSES</text>
</svg>