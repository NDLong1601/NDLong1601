<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 145" width="100%" height="145">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="boardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090e1a"/>
      <stop offset="50%" stop-color="#0c1322"/>
      <stop offset="100%" stop-color="#080b14"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF007A"/>
      <stop offset="25%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="75%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#FFB800"/>
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#131b2e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0b101d" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Shimmer Effect -->
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animate attributeName="x1" values="-100%;200%" dur="3.5s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0%;300%" dur="3.5s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .board-frame { fill: url(#boardBg); stroke: #1e293b; stroke-width: 1.5; }
    .hud-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace; font-size: 10px; font-weight: 800; letter-spacing: 1.2px; }
    .hud-meta { font-family: monospace; font-size: 9px; font-weight: 700; fill: #64748b; letter-spacing: 0.8px; }
    .badge-name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #f8fafc; text-anchor: middle; }
    .badge-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 8.5px; font-weight: 500; fill: #94a3b8; text-anchor: middle; }
    .rank-text { font-family: monospace; font-size: 9px; font-weight: 800; text-anchor: middle; }
    
    @keyframes pulseTier {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
  </style>

  <!-- Main Container Frame -->
  <rect class="board-frame" x="2" y="2" width="846" height="141" rx="12" />
  
  <!-- Glowing Neon Top Strip -->
  <rect x="20" y="2" width="810" height="2" fill="url(#neonBorder)" rx="1" filter="url(#badgeGlow)" />

  <!-- HUD Header -->
  <g transform="translate(24, 20)">
    <circle cx="0" cy="0" r="3.5" fill="#FFB800">
      <animate attributeName="opacity" values="1;0.4;1" dur="1.2s" repeatCount="indefinite" />
    </circle>
    <text class="hud-title" x="10" y="3" fill="#FFB800">ARCADE ACHIEVEMENTS &amp; TROPHIES</text>
    <text class="hud-meta" x="240" y="3">|</text>
    <text class="hud-meta" x="252" y="3" fill="#00E5FF">ALL QUESTS COMPLETED</text>
    
    <!-- Right side telemetry -->
    <text class="hud-meta" x="530" y="3">TIER: <tspan fill="#EC4899">S-RANK MASTER</tspan></text>
    <text class="hud-meta" x="665" y="3">|</text>
    <text class="hud-meta" x="678" y="3">XP: <tspan fill="#10B981">9,850 PTS</tspan></text>
    <text class="hud-meta" x="772" y="3" fill="#FFB800">★ 5/5</text>
  </g>

  <!-- ==================== BADGE 1: MULTI-LANGUAGE (RANK S) ==================== -->
  <g transform="translate(20, 36)">
    <!-- Card Frame -->
    <rect x="0" y="0" width="150" height="96" rx="8" fill="url(#cardBg)" stroke="#831843" stroke-width="1.2" />
    <rect x="0" y="0" width="150" height="96" rx="8" fill="url(#shimmer)" />
    
    <!-- Rank Pill -->
    <rect x="43" y="10" width="64" height="16" rx="8" fill="#500724" stroke="#f43f5e" stroke-width="1" />
    <text class="rank-text" x="75" y="21" fill="#fb7185">TIER S ★</text>
    
    <!-- Icon / Emblem -->
    <text x="75" y="52" font-size="22" text-anchor="middle">💎</text>
    
    <!-- Info -->
    <text class="badge-name" x="75" y="70">Polyglot Dev</text>
    <text class="badge-desc" x="75" y="84">Dart • Kotlin • Py • JS</text>
  </g>

  <!-- ==================== BADGE 2: COMMITS (RANK A) ==================== -->
  <g transform="translate(182, 36)">
    <rect x="0" y="0" width="150" height="96" rx="8" fill="url(#cardBg)" stroke="#064e3b" stroke-width="1.2" />
    <rect x="0" y="0" width="150" height="96" rx="8" fill="url(#shimmer)" />
    
    <rect x="43" y="10" width="64" height="16" rx="8" fill="#022c22" stroke="#10b981" stroke-width="1" />
    <text class="rank-text" x="75" y="21" fill="#34d399">RANK A+</text>
    
    <text x="75" y="52" font-size="22" text-anchor="middle">⚡</text>
    
    <text class="badge-name" x="75" y="70">Hyper Committer</text>
    <text class="badge-desc" x="75" y="84">260+ Contributions</text>
  </g>

  <!-- ==================== BADGE 3: FLUTTER CRAFTSMAN (ELITE) ==================== -->
  <g transform="translate(344, 36)">
    <rect x="0" y="0" width="150" height="96" rx="8" fill="url(#cardBg)" stroke="#0e7490" stroke-width="1.2" />
    <rect x="0" y="0" width="150" height="96" rx="8" fill="url(#shimmer)" />
    
    <rect x="43" y="10" width="64" height="16" rx="8" fill="#083344" stroke="#06b6d4" stroke-width="1" />
    <text class="rank-text" x="75" y="21" fill="#22d3ee">ELITE</text>
    
    <text x="75" y="52" font-size="22" text-anchor="middle">📱</text>
    
    <text class="badge-name" x="75" y="70">Flutter Craftsman</text>
    <text class="badge-desc" x="75" y="84">Pixel-Perfect UI/UX</text>
  </g>

  <!-- ==================== BADGE 4: CLEAN ARCHITECT (MASTER) ==================== -->
  <g transform="translate(506, 36)">
    <rect x="0" y="0" width="150" height="96" rx="8" fill="url(#cardBg)" stroke="#3730a3" stroke-width="1.2" />
    <rect x="0" y="0" width="150" height="96" rx="8" fill="url(#shimmer)" />
    
    <rect x="43" y="10" width="64" height="16" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="1" />
    <text class="rank-text" x="75" y="21" fill="#a5b4fc">MASTER</text>
    
    <text x="75" y="52" font-size="22" text-anchor="middle">🧠</text>
    
    <text class="badge-name" x="75" y="70">Clean Architect</text>
    <text class="badge-desc" x="75" y="84">BLoC • Riverpod • Arch</text>
  </g>

  <!-- ==================== BADGE 5: REPOSITORIES (TIER B+) ==================== -->
  <g transform="translate(668, 36)">
    <rect x="0" y="0" width="150" height="96" rx="8" fill="url(#cardBg)" stroke="#78350f" stroke-width="1.2" />
    <rect x="0" y="0" width="150" height="96" rx="8" fill="url(#shimmer)" />
    
    <rect x="43" y="10" width="64" height="16" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="1" />
    <text class="rank-text" x="75" y="21" fill="#fcd34d">RANK B+</text>
    
    <text x="75" y="52" font-size="22" text-anchor="middle">📦</text>
    
    <text class="badge-name" x="75" y="70">Repo Creator</text>
    <text class="badge-desc" x="75" y="84">15+ Projects &amp; Apps</text>
  </g>
</svg>
