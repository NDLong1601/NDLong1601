<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 310" width="100%" height="310">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="tessBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040612"/>
      <stop offset="50%" stop-color="#080d22"/>
      <stop offset="100%" stop-color="#03040c"/>
    </linearGradient>

    <!-- Top Neon Accent -->
    <linearGradient id="tessAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="35%" stop-color="#3B82F6"/>
      <stop offset="70%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>

    <!-- Core Glow -->
    <radialGradient id="tessCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#A855F7" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#00E5FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="tessGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .tess-frame { fill: url(#tessBg); stroke: #1e293b; stroke-width: 1.5; }
    .hud-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace; font-size: 10px; font-weight: 800; letter-spacing: 1.2px; }
    .hud-sub { font-family: monospace; font-size: 9px; font-weight: 700; fill: #64748b; }
    .panel-header { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace; font-size: 9.5px; font-weight: 800; letter-spacing: 1px; }
    .panel-label { font-family: monospace; font-size: 8.5px; fill: #64748b; }
    .panel-val { font-family: monospace; font-size: 9px; font-weight: 700; fill: #f8fafc; }
  </style>

  <!-- Frame Background -->
  <rect class="tess-frame" x="2" y="2" width="846" height="306" rx="12" />

  <!-- Top Accent Strip -->
  <rect x="20" y="2" width="810" height="2" fill="url(#tessAccent)" rx="1" filter="url(#tessGlow)" />

  <!-- HUD Header -->
  <g transform="translate(24, 20)">
    <circle cx="0" cy="0" r="3.5" fill="#A855F7">
      <animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite" />
    </circle>
    <text class="hud-title" x="12" y="3" fill="#A855F7">[3D MODEL F] 4D HYPERCUBE TESSERACT // QUANTUM CODE VAULT</text>
    <text class="hud-sub" x="495" y="3">|</text>
    <text class="hud-sub" x="508" y="3" fill="#00E5FF">DIMENSION: 4D ➔ 3D ISOMETRIC</text>

    <!-- Right Header -->
    <text class="hud-sub" x="650" y="3">PROJECTION: <tspan fill="#34D399">HYPER-ROTATION</tspan></text>
    <text class="hud-sub" x="765" y="3">|</text>
    <text class="hud-sub" x="778" y="3" fill="#EC4899">● LOCKED</text>
  </g>

  <!-- ==================== LEFT PANEL: 4D HYPER-GEOMETRY ==================== -->
  <g transform="translate(24, 46)">
    <rect x="0" y="0" width="200" height="245" rx="8" fill="#080c1d" stroke="#1e293b" stroke-width="1.2" />
    <rect x="10" y="10" width="180" height="22" rx="4" fill="#180e2b" stroke="#A855F7" stroke-width="0.8" />
    <text class="panel-header" x="18" y="25" fill="#A855F7">💠 4D HYPER-GEOMETRY</text>

    <g transform="translate(14, 52)">
      <text class="panel-label" x="0" y="0">SPATIAL DIMENSIONS</text>
      <text class="panel-val" x="0" y="14" fill="#38BDF8">4D (X, Y, Z, W Axis)</text>

      <text class="panel-label" x="0" y="36">VERTICES / EDGES</text>
      <text class="panel-val" x="0" y="50" fill="#10B981">16 Vertices • 32 Edges</text>

      <text class="panel-label" x="0" y="72">HYPER-ROTATION SPEED</text>
      <text class="panel-val" x="0" y="86" fill="#818CF8">0.5 rad/s (Dual Orthogonal)</text>

      <text class="panel-label" x="0" y="108">INNER/OUTER RATIO</text>
      <text class="panel-val" x="0" y="122" fill="#F472B6">1 : 2.618 (Golden Section)</text>

      <text class="panel-label" x="0" y="144">DATA INTEGRITY</text>
      <text class="panel-val" x="0" y="158" fill="#FBBF24">Zero Distortion Matrix</text>
    </g>

    <line x1="12" y1="228" x2="188" y2="228" stroke="#1e293b" stroke-width="1" />
    <text class="panel-label" x="14" y="240" fill="#64748b">PROJECTION: <tspan fill="#10B981">STEREO-GRAPHIC</tspan></text>
  </g>

  <!-- ==================== CENTER: 4D HYPERCUBE TESSERACT ==================== -->
  <g class="tesseract-3d" transform="translate(425, 160)">
    <!-- Hovering -->
    <animateTransform attributeName="transform" type="translate" values="425 154; 425 166; 425 154" dur="3.2s" repeatCount="indefinite"/>

    <!-- Floor Shadow -->
    <ellipse cx="0" cy="85" rx="80" ry="16" fill="#000000" opacity="0.6"/>

    <!-- Core Plasma Singularity -->
    <circle cx="0" cy="0" r="30" fill="url(#tessCore)"/>
    <circle cx="0" cy="0" r="10" fill="#ffffff" filter="url(#tessGlow)">
      <animate attributeName="r" values="8;14;8" dur="1.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Outer Cube Vertices -->
    <!-- Top-Left: (-60,-60), Top-Right: (60,-60), Bottom-Right: (60,60), Bottom-Left: (-60,60) -->
    <!-- Isometric Outer Frame -->
    <polygon points="0,-75 65,-38 65,38 0,75 -65,38 -65,-38" fill="none" stroke="#A855F7" stroke-width="2" filter="url(#tessGlow)"/>

    <!-- Inner Cube (Oscillates size as it rotates through W-axis) -->
    <!-- Inner Vertices -->
    <polygon points="0,-35 30,-18 30,18 0,35 -30,18 -30,-18" fill="none" stroke="#00E5FF" stroke-width="2" filter="url(#tessGlow)">
      <animate attributeName="points" 
               values="0,-35 30,-18 30,18 0,35 -30,18 -30,-18; 0,-50 48,-25 48,25 0,50 -48,25 -48,-25; 0,-20 18,-10 18,10 0,20 -18,10 -18,-10; 0,-35 30,-18 30,18 0,35 -30,18 -30,-18" 
               dur="4s" repeatCount="indefinite"/>
    </polygon>

    <!-- 8 Connecting Diagonal Hypercube Struts -->
    <!-- Top -->
    <line x1="0" y1="-75" x2="0" y2="-35" stroke="#38BDF8" stroke-width="1.5">
      <animate attributeName="y2" values="-35;-50;-20;-35" dur="4s" repeatCount="indefinite"/>
    </line>
    <!-- Top-Right -->
    <line x1="65" y1="-38" x2="30" y2="-18" stroke="#38BDF8" stroke-width="1.5">
      <animate attributeName="x2" values="30;48;18;30" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="-18;-25;-10;-18" dur="4s" repeatCount="indefinite"/>
    </line>
    <!-- Bottom-Right -->
    <line x1="65" y1="38" x2="30" y2="18" stroke="#38BDF8" stroke-width="1.5">
      <animate attributeName="x2" values="30;48;18;30" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="18;25;10;18" dur="4s" repeatCount="indefinite"/>
    </line>
    <!-- Bottom -->
    <line x1="0" y1="75" x2="0" y2="35" stroke="#38BDF8" stroke-width="1.5">
      <animate attributeName="y2" values="35;50;20;35" dur="4s" repeatCount="indefinite"/>
    </line>
    <!-- Bottom-Left -->
    <line x1="-65" y1="38" x2="-30" y2="18" stroke="#38BDF8" stroke-width="1.5">
      <animate attributeName="x2" values="-30;-48;-18;-30" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="18;25;10;18" dur="4s" repeatCount="indefinite"/>
    </line>
    <!-- Top-Left -->
    <line x1="-65" y1="-38" x2="-30" y2="-18" stroke="#38BDF8" stroke-width="1.5">
      <animate attributeName="x2" values="-30;-48;-18;-30" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="-18;-25;-10;-18" dur="4s" repeatCount="indefinite"/>
    </line>

    <!-- Pulsing Vertex Energy Nodes -->
    <circle cx="0" cy="-75" r="3.5" fill="#00E5FF"/>
    <circle cx="65" cy="-38" r="3.5" fill="#A855F7"/>
    <circle cx="65" cy="38" r="3.5" fill="#EC4899"/>
    <circle cx="0" cy="75" r="3.5" fill="#00E5FF"/>
    <circle cx="-65" cy="38" r="3.5" fill="#A855F7"/>
    <circle cx="-65" cy="-38" r="3.5" fill="#EC4899"/>

    <text x="0" y="105" font-family="monospace" font-size="8.5" font-weight="900" fill="#A855F7" text-anchor="middle" letter-spacing="1">HYPER-ROTATION: 4-AXIS W</text>
  </g>

  <!-- ==================== RIGHT PANEL: CRYPTOGRAPHIC VAULT ==================== -->
  <g transform="translate(626, 46)">
    <rect x="0" y="0" width="200" height="245" rx="8" fill="#080d1d" stroke="#1e293b" stroke-width="1.2" />
    <rect x="10" y="10" width="180" height="22" rx="4" fill="#0c1833" stroke="#00E5FF" stroke-width="0.8" />
    <text class="panel-header" x="18" y="25" fill="#00E5FF">🔐 QUANTUM CODE VAULT</text>

    <g transform="translate(14, 52)">
      <text class="panel-label" x="0" y="0">ENCRYPTION PROTOCOL</text>
      <text class="panel-val" x="0" y="14" fill="#38BDF8">SHA-512 Quantum-Resistant</text>

      <text class="panel-label" x="0" y="36">CLEAN CODE INTEGRITY</text>
      <text class="panel-val" x="0" y="50" fill="#10B981">Zero Vulnerabilities (Snyk)</text>

      <text class="panel-label" x="0" y="72">SECRET MANAGEMENT</text>
      <text class="panel-val" x="0" y="86" fill="#818CF8">Zero-Knowledge Hardware</text>

      <text class="panel-label" x="0" y="108">APP SIGNING KEYS</text>
      <text class="panel-val" x="0" y="122" fill="#F472B6">Android JKS • Apple KeyStore</text>

      <text class="panel-label" x="0" y="144">ACCESS LEVEL</text>
      <text class="panel-val" x="0" y="158" fill="#FBBF24">Lead Architect Only</text>
    </g>

    <line x1="12" y1="228" x2="188" y2="228" stroke="#1e293b" stroke-width="1" />
    <text class="panel-label" x="14" y="240" fill="#64748b">STATUS: <tspan fill="#10B981">QUANTUM LOCKED</tspan></text>
  </g>
</svg>