<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="240">
  <defs>
    <linearGradient id="ikBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080c16"/>
      <stop offset="100%" stop-color="#04060d"/>
    </linearGradient>
    <filter id="rgbGlow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
  </defs>
  <rect width="400" height="240" rx="8" fill="url(#ikBg)" stroke="#1e293b"/>
  <text x="14" y="22" font-family="monospace" font-size="9" font-weight="bold" fill="#38BDF8">[DEMO 09] 3D ISOMETRIC KEYCAPS WAVE</text>
  <text x="315" y="22" font-family="monospace" font-size="8" fill="#38BDF8">● TACTILE</text>
  <line x1="14" y1="30" x2="386" y2="30" stroke="#1e293b"/>

  <!-- Keycap Helper Generator -->
  <!-- 4 Isometric Keycaps in a Row: C - O - D - E -->
  <!-- Key 1: C -->
  <g transform="translate(80, 110)">
    <animateTransform attributeName="transform" type="translate" values="80 110; 80 118; 80 110" dur="1.6s" begin="0.0s" repeatCount="indefinite"/>
    <!-- Bottom base shadow -->
    <polygon points="0,15 35,0 70,15 35,30" fill="#0284c7" opacity="0.6" filter="url(#rgbGlow)"/>
    <!-- Left face -->
    <polygon points="0,15 35,30 35,50 0,35" fill="#0f172a" stroke="#1e293b"/>
    <!-- Right face -->
    <polygon points="35,30 70,15 70,35 35,50" fill="#1e293b" stroke="#334155"/>
    <!-- Top Face -->
    <polygon points="0,15 35,0 70,15 35,30" fill="#1e293b" stroke="#38BDF8" stroke-width="1.2"/>
    <text x="35" y="19" font-family="monospace" font-size="11" font-weight="900" fill="#38BDF8" text-anchor="middle">C</text>
  </g>

  <!-- Key 2: O -->
  <g transform="translate(145, 110)">
    <animateTransform attributeName="transform" type="translate" values="145 110; 145 118; 145 110" dur="1.6s" begin="0.4s" repeatCount="indefinite"/>
    <polygon points="0,15 35,0 70,15 35,30" fill="#818CF8" opacity="0.6" filter="url(#rgbGlow)"/>
    <polygon points="0,15 35,30 35,50 0,35" fill="#0f172a" stroke="#1e293b"/>
    <polygon points="35,30 70,15 70,35 35,50" fill="#1e293b" stroke="#334155"/>
    <polygon points="0,15 35,0 70,15 35,30" fill="#1e293b" stroke="#818CF8" stroke-width="1.2"/>
    <text x="35" y="19" font-family="monospace" font-size="11" font-weight="900" fill="#818CF8" text-anchor="middle">O</text>
  </g>

  <!-- Key 3: D -->
  <g transform="translate(210, 110)">
    <animateTransform attributeName="transform" type="translate" values="210 110; 210 118; 210 110" dur="1.6s" begin="0.8s" repeatCount="indefinite"/>
    <polygon points="0,15 35,0 70,15 35,30" fill="#EC4899" opacity="0.6" filter="url(#rgbGlow)"/>
    <polygon points="0,15 35,30 35,50 0,35" fill="#0f172a" stroke="#1e293b"/>
    <polygon points="35,30 70,15 70,35 35,50" fill="#1e293b" stroke="#334155"/>
    <polygon points="0,15 35,0 70,15 35,30" fill="#1e293b" stroke="#EC4899" stroke-width="1.2"/>
    <text x="35" y="19" font-family="monospace" font-size="11" font-weight="900" fill="#EC4899" text-anchor="middle">D</text>
  </g>

  <!-- Key 4: E -->
  <g transform="translate(275, 110)">
    <animateTransform attributeName="transform" type="translate" values="275 110; 275 118; 275 110" dur="1.6s" begin="1.2s" repeatCount="indefinite"/>
    <polygon points="0,15 35,0 70,15 35,30" fill="#10B981" opacity="0.6" filter="url(#rgbGlow)"/>
    <polygon points="0,15 35,30 35,50 0,35" fill="#0f172a" stroke="#1e293b"/>
    <polygon points="35,30 70,15 70,35 35,50" fill="#1e293b" stroke="#334155"/>
    <polygon points="0,15 35,0 70,15 35,30" fill="#1e293b" stroke="#10B981" stroke-width="1.2"/>
    <text x="35" y="19" font-family="monospace" font-size="11" font-weight="900" fill="#10B981" text-anchor="middle">E</text>
  </g>

  <text x="200" y="210" font-family="monospace" font-size="8" fill="#64748b" text-anchor="middle">CLICKY MECHANICAL SWITCHES • RGB WAVE</text>
</svg>