<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="240">
  <defs>
    <linearGradient id="hcBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080c16"/>
      <stop offset="100%" stop-color="#04060d"/>
    </linearGradient>
    <linearGradient id="irid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#8B5CF6" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#00E5FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.8"/>
      <animate attributeName="x1" values="0;1;0" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="y1" values="0;1;0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" rx="8" fill="url(#hcBg)" stroke="#1e293b"/>
  <text x="14" y="22" font-family="monospace" font-size="9" font-weight="bold" fill="#EC4899">[DEMO 05] 3D PARALLAX HOLO CARD</text>
  <text x="315" y="22" font-family="monospace" font-size="8" fill="#EC4899">● IRIDESCENT</text>
  <line x1="14" y1="30" x2="386" y2="30" stroke="#1e293b"/>

  <!-- 3D Tilted Card Body -->
  <g transform="translate(200, 135) rotate(-6) skewX(-4)">
    <animateTransform attributeName="transform" type="rotate" values="-8 200 135; -4 200 135; -8 200 135" dur="3s" repeatCount="indefinite"/>

    <!-- Card Shadow -->
    <rect x="-95" y="-55" width="190" height="110" rx="8" fill="#000" opacity="0.5" transform="translate(10, 12)"/>

    <!-- Card Base -->
    <rect x="-95" y="-55" width="190" height="110" rx="8" fill="#0f172a" stroke="url(#irid)" stroke-width="2"/>
    <rect x="-95" y="-55" width="190" height="110" rx="8" fill="url(#irid)" opacity="0.18"/>

    <!-- Gold Chip -->
    <rect x="-75" y="-35" width="28" height="22" rx="3" fill="#F59E0B" stroke="#B45309" stroke-width="1"/>
    <line x1="-75" y1="-24" x2="-47" y2="-24" stroke="#78350f" stroke-width="0.8"/>
    <line x1="-61" y1="-35" x2="-61" y2="-13" stroke="#78350f" stroke-width="0.8"/>

    <!-- Card Info -->
    <text x="45" y="-35" font-family="monospace" font-size="9" font-weight="bold" fill="#00E5FF">RANK S ★</text>
    <text x="-75" y="15" font-family="monospace" font-size="11" font-weight="900" fill="#f8fafc" letter-spacing="1">NDLONG1601</text>
    <text x="-75" y="32" font-family="sans-serif" font-size="8" font-weight="bold" fill="#94a3b8">MOBILE ARCHITECT • 2026</text>
    <text x="50" y="36" font-family="sans-serif" font-size="14" fill="#00E5FF">📱</text>
  </g>
</svg>