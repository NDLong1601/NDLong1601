<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="240">
  <defs>
    <linearGradient id="cnBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080c16"/>
      <stop offset="100%" stop-color="#04060d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="coinGlow">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
  </defs>
  <rect width="400" height="240" rx="8" fill="url(#cnBg)" stroke="#1e293b"/>
  <text x="14" y="22" font-family="monospace" font-size="9" font-weight="bold" fill="#F59E0B">[DEMO 04] 3D FLIPPING CYBER COIN</text>
  <text x="315" y="22" font-family="monospace" font-size="8" fill="#F59E0B">● 360° SPIN</text>
  <line x1="14" y1="30" x2="386" y2="30" stroke="#1e293b"/>

  <!-- Floor shadow -->
  <ellipse cx="200" cy="205" rx="45" ry="8" fill="#000" opacity="0.6">
    <animate attributeName="rx" values="45;10;45;10;45" dur="3s" repeatCount="indefinite"/>
  </ellipse>

  <!-- 3D Spinning Coin Body -->
  <!-- Outer rim width oscillates from 50 to 5 to 50 -->
  <ellipse cx="200" cy="135" rx="50" ry="50" fill="url(#gold)" stroke="#78350f" stroke-width="2" filter="url(#coinGlow)">
    <animate attributeName="rx" values="50;3;50;3;50" dur="3s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Inner Face Ring -->
  <ellipse cx="200" cy="135" rx="42" ry="42" fill="#0f172a" stroke="#FBBF24" stroke-width="1.5">
    <animate attributeName="rx" values="42;2;42;2;42" dur="3s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Coin Emblem (Scales horizontally as coin turns) -->
  <g transform="translate(200, 135)">
    <text x="0" y="6" font-family="sans-serif" font-size="18" font-weight="900" fill="#00E5FF" text-anchor="middle">
      <animate attributeName="opacity" values="1;0;1;0;1" dur="3s" repeatCount="indefinite"/>
      ✦
    </text>
    <text x="0" y="22" font-family="monospace" font-size="7" font-weight="900" fill="#F59E0B" text-anchor="middle">
      <animate attributeName="opacity" values="1;0;1;0;1" dur="3s" repeatCount="indefinite"/>
      FLUTTER
    </text>
  </g>
</svg>