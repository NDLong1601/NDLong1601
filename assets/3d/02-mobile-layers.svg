<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="240">
  <defs>
    <linearGradient id="mbBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080c16"/>
      <stop offset="100%" stop-color="#04060d"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" rx="8" fill="url(#mbBg)" stroke="#1e293b"/>
  <text x="14" y="22" font-family="monospace" font-size="9" font-weight="bold" fill="#38BDF8">[DEMO 02] 3D FLOATING MOBILE LAYERS</text>
  <text x="305" y="22" font-family="monospace" font-size="8" fill="#38BDF8">● DECONSTRUCT</text>
  <line x1="14" y1="30" x2="386" y2="30" stroke="#1e293b"/>

  <!-- Exploded View Center (X=200) -->
  <!-- Layer 1: Hardware Chassis (Base) -->
  <g transform="translate(200, 165)">
    <polygon points="-75,-25 75,-25 100,25 -50,25" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="90" y="10" font-family="monospace" font-size="7" fill="#64748b">L1: HARDWARE</text>
  </g>

  <!-- Connecting dashed laser beams -->
  <line x1="150" y1="140" x2="150" y2="70" stroke="#00E5FF" stroke-width="1" stroke-dasharray="2,3" opacity="0.6"/>
  <line x1="250" y1="140" x2="250" y2="70" stroke="#00E5FF" stroke-width="1" stroke-dasharray="2,3" opacity="0.6"/>

  <!-- Layer 2: Glassmorphism Screen (Mid Hover) -->
  <g transform="translate(200, 120)">
    <animateTransform attributeName="transform" type="translate" values="200 122; 200 116; 200 122" dur="3s" repeatCount="indefinite"/>
    <polygon points="-70,-22 70,-22 92,22 -48,22" fill="#0369a1" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="82" y="10" font-family="monospace" font-size="7" fill="#38BDF8">L2: GLASS UI</text>
  </g>

  <!-- Layer 3: Floating Flutter UI Widgets (Top Hover) -->
  <g transform="translate(200, 75)">
    <animateTransform attributeName="transform" type="translate" values="200 72; 200 64; 200 72" dur="2.5s" repeatCount="indefinite"/>
    
    <!-- Mini UI Card 1 (Bank Card) -->
    <polygon points="-55,-18 25,-18 42,12 -38,12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1"/>
    <text x="-5" y="0" font-family="sans-serif" font-size="7" font-weight="bold" fill="#ffffff">Flutter Pay</text>

    <!-- Mini UI Button 2 (Floating Action Button) -->
    <circle cx="55" cy="5" r="10" fill="#10B981" stroke="#34D399" stroke-width="1"/>
    <text x="55" y="9" font-family="monospace" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">+</text>

    <text x="75" y="10" font-family="monospace" font-size="7" fill="#10B981">L3: WIDGETS</text>
  </g>
</svg>