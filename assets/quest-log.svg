<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 295" width="100%" height="295">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="questBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0e1526"/>
      <stop offset="100%" stop-color="#090d18"/>
    </linearGradient>

    <!-- Top Neon Strip -->
    <linearGradient id="questBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="30%" stop-color="#10B981"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <!-- Column Card Background -->
    <linearGradient id="panelBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121a2e" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0b101c" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Shimmer for Title -->
    <linearGradient id="goldShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .frame { fill: url(#questBg); stroke: #1e293b; stroke-width: 1.5; }
    .panel-frame { fill: url(#panelBg); stroke-width: 1.2; }
    
    .pixel-title {
      font-family: 'Courier New', Courier, monospace;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
    }
    .pixel-meta {
      font-family: 'Courier New', Courier, monospace;
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .panel-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.8px;
    }
    .panel-item-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 10px;
      font-weight: 700;
      fill: #f1f5f9;
    }
    .panel-item-desc {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 9px;
      font-weight: 500;
      fill: #94a3b8;
    }
    .badge-tag {
      font-family: monospace;
      font-size: 8px;
      font-weight: 800;
    }
  </style>

  <!-- Outer Frame -->
  <rect class="frame" x="2" y="2" width="846" height="291" rx="10" />

  <!-- Top Glowing Accent -->
  <rect x="18" y="2" width="814" height="2" fill="url(#questBorder)" rx="1" filter="url(#neonGlow)" />

  <!-- Window Header / Title Bar -->
  <g transform="translate(20, 20)">
    <!-- 8-Bit Controller / Sword Icon -->
    <rect x="0" y="-8" width="16" height="16" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="8" y="4" font-size="10" text-anchor="middle">⚔️</text>

    <text class="pixel-title" x="24" y="4" fill="url(#goldShimmer)">[ QUEST LOG &amp; HERO STATUS: NDLong1601 ]</text>
    <text class="pixel-meta" x="350" y="4" fill="#64748b">CLASS: <tspan fill="#00E5FF">FLUTTER WARRIOR</tspan></text>
    
    <!-- Status Stats on Right -->
    <text class="pixel-meta" x="525" y="4" fill="#94a3b8">HP: <tspan fill="#10B981">999/999</tspan></text>
    <text class="pixel-meta" x="610" y="4" fill="#94a3b8">MP: <tspan fill="#38BDF8">750/750</tspan></text>
    <text class="pixel-meta" x="695" y="4" fill="#94a3b8">LVL: <tspan fill="#EC4899">22</tspan></text>
    
    <!-- EXP Progress Bar -->
    <g transform="translate(755, -4)">
      <rect x="0" y="0" width="55" height="10" rx="3" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <rect x="1" y="1" width="46" height="8" rx="2" fill="#10B981">
        <animate attributeName="width" values="40;48;40" dur="2s" repeatCount="indefinite"/>
      </rect>
      <text x="27" y="7.5" font-family="monospace" font-size="7" font-weight="800" fill="#ffffff" text-anchor="middle">85%</text>
    </g>
  </g>

  <!-- Divider Line -->
  <line x1="20" y1="42" x2="830" y2="42" stroke="#1e293b" stroke-width="1" />

  <!-- ==================== COLUMN 1: MAIN QUESTS (2026 ROADMAP) ==================== -->
  <g transform="translate(20, 52)">
    <!-- Panel Box -->
    <rect class="panel-frame" x="0" y="0" width="256" height="225" rx="8" stroke="#10b981" />
    
    <!-- Header Badge -->
    <rect x="12" y="12" width="232" height="24" rx="5" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text class="panel-title" x="22" y="28" fill="#34d399">📜 MAIN QUESTS (ROADMAP 2026)</text>
    
    <!-- Quest Item 1 -->
    <g transform="translate(14, 52)">
      <rect x="0" y="0" width="14" height="14" rx="3" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text x="7" y="10.5" font-family="monospace" font-size="10" font-weight="900" fill="#34d399" text-anchor="middle">✓</text>
      <text class="panel-item-title" x="22" y="8">Publish 2+ Mobile Apps</text>
      <text class="panel-item-desc" x="22" y="20">Target: Google Play &amp; App Store</text>
    </g>

    <!-- Quest Item 2 -->
    <g transform="translate(14, 94)">
      <rect x="0" y="0" width="14" height="14" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="7" y="10" font-family="monospace" font-size="9" fill="#38bdf8" text-anchor="middle">⏳</text>
      <text class="panel-item-title" x="22" y="8">Master Clean Architecture</text>
      <text class="panel-item-desc" x="22" y="20">Deep dive BLoC &amp; Riverpod at scale</text>
    </g>

    <!-- Quest Item 3 -->
    <g transform="translate(14, 136)">
      <rect x="0" y="0" width="14" height="14" rx="3" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
      <text x="7" y="10" font-family="monospace" font-size="9" fill="#f59e0b" text-anchor="middle">✦</text>
      <text class="panel-item-title" x="22" y="8">AI on Mobile Devices</text>
      <text class="panel-item-desc" x="22" y="20">Embed TFLite / ONNX onto smartphones</text>
    </g>

    <!-- Quest Item 4 -->
    <g transform="translate(14, 178)">
      <rect x="0" y="0" width="14" height="14" rx="3" fill="#1e293b" stroke="#c084fc" stroke-width="1"/>
      <text x="7" y="10" font-family="monospace" font-size="9" fill="#c084fc" text-anchor="middle">★</text>
      <text class="panel-item-title" x="22" y="8">Open Source Contributor</text>
      <text class="panel-item-desc" x="22" y="20">Contribute to Flutter/Dart community</text>
    </g>
  </g>

  <!-- ==================== COLUMN 2: PASSIVE BUFFS (FUN FACTS & HABITS) ==================== -->
  <g transform="translate(296, 52)">
    <rect class="panel-frame" x="0" y="0" width="256" height="225" rx="8" stroke="#38bdf8" />
    
    <rect x="12" y="12" width="232" height="24" rx="5" fill="#082f49" stroke="#38bdf8" stroke-width="1"/>
    <text class="panel-title" x="22" y="28" fill="#38bdf8">⚡ PASSIVE BUFFS &amp; HABITS</text>

    <!-- Buff Item 1 -->
    <g transform="translate(14, 52)">
      <text x="8" y="14" font-size="16">🌙</text>
      <text class="panel-item-title" x="26" y="8">Night Owl Flow State</text>
      <text class="panel-item-desc" x="26" y="20">+50% Debugging &amp; UI focus past 23:00</text>
    </g>

    <!-- Buff Item 2 -->
    <g transform="translate(14, 94)">
      <text x="8" y="14" font-size="16">⌨️</text>
      <text class="panel-item-title" x="26" y="8">Mechanical Setup + Lo-Fi</text>
      <text class="panel-item-desc" x="26" y="20">Clicky tactile switches + Iced coffee</text>
    </g>

    <!-- Buff Item 3 -->
    <g transform="translate(14, 136)">
      <text x="8" y="14" font-size="16">🎨</text>
      <text class="panel-item-title" x="26" y="8">Pixel-Perfect Instinct</text>
      <text class="panel-item-desc" x="26" y="20">100% fidelity Figma to Flutter widgets</text>
    </g>

    <!-- Buff Item 4 -->
    <g transform="translate(14, 178)">
      <text x="8" y="14" font-size="16">🎧</text>
      <text class="panel-item-title" x="26" y="8">Rhythm-Driven Coding</text>
      <text class="panel-item-desc" x="26" y="20">Vibing Spotify playlist while compiling</text>
    </g>
  </g>

  <!-- ==================== COLUMN 3: SKILL TREE (TECH RADAR) ==================== -->
  <g transform="translate(572, 52)">
    <rect class="panel-frame" x="0" y="0" width="258" height="225" rx="8" stroke="#ec4899" />
    
    <rect x="12" y="12" width="234" height="24" rx="5" fill="#500724" stroke="#ec4899" stroke-width="1"/>
    <text class="panel-title" x="22" y="28" fill="#f43f5e">🔮 SKILL TREE (TECH RADAR)</text>

    <!-- Tech Item 1 -->
    <g transform="translate(14, 52)">
      <text x="8" y="14" font-size="16">📱</text>
      <text class="panel-item-title" x="26" y="8">Flutter 3.x &amp; Dart 3+</text>
      <text class="panel-item-desc" x="26" y="20">Patterns, Records, FFI Native Interop</text>
    </g>

    <!-- Tech Item 2 -->
    <g transform="translate(14, 94)">
      <text x="8" y="14" font-size="16">🗄️</text>
      <text class="panel-item-title" x="26" y="8">Local-First Storage</text>
      <text class="panel-item-desc" x="26" y="20">SQLite, Hive, Isar &amp; ObjectBox</text>
    </g>

    <!-- Tech Item 3 -->
    <g transform="translate(14, 136)">
      <text x="8" y="14" font-size="16">⚙️</text>
      <text class="panel-item-title" x="26" y="8">Automated CI/CD Pipelines</text>
      <text class="panel-item-desc" x="26" y="20">Fastlane &amp; GitHub Actions deployment</text>
    </g>

    <!-- Tech Item 4 -->
    <g transform="translate(14, 178)">
      <text x="8" y="14" font-size="16">🤖</text>
      <text class="panel-item-title" x="26" y="8">Edge AI Integration</text>
      <text class="panel-item-desc" x="26" y="20">Computer Vision &amp; On-device models</text>
    </g>
  </g>
</svg>
