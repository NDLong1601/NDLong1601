<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 60" width="100%" height="60">
  <defs>
    <style>
      .bg { fill: transparent; }
      .dot { rx: 3px; ry: 3px; }
      @keyframes chomp {
        0%, 100% { d: path("M 20 20 A 15 15 0 1 0 20 20 Z"); }
        50% { d: path("M 20 20 L 32 10 A 15 15 0 1 0 32 30 Z"); }
      }
    </style>
  </defs>

  <!-- Arcade Track Border Line -->
  <line x1="20" y1="52" x2="830" y2="52" stroke="#1f293d" stroke-width="2" stroke-dasharray="6,6" />

  <!-- Moving Arcade Group -->
  <g>
    <!-- Seamless infinite horizontal crawl -->
    <animateTransform attributeName="transform" type="translate" from="-280 0" to="870 0" dur="8s" repeatCount="indefinite" />

    <!-- PAC-MAN -->
    <g transform="translate(180, 15)">
      <path fill="#FFD700" d="M 18 18 L 32 8 A 16 16 0 1 0 32 28 Z">
        <animate attributeName="d" 
                 values="M 18 18 L 32 8 A 16 16 0 1 0 32 28 Z; M 18 18 L 34 18 A 16 16 0 1 0 34 18.1 Z; M 18 18 L 32 8 A 16 16 0 1 0 32 28 Z" 
                 dur="0.3s" repeatCount="indefinite" />
      </path>
      <!-- Pacman Eye -->
      <circle cx="16" cy="10" r="2.5" fill="#000" />
    </g>

    <!-- GHOST 1: BLINKY (RED) -->
    <g transform="translate(110, 16)">
      <!-- Ghost Body -->
      <path fill="#FF0000" d="M 0 16 A 12 12 0 0 1 24 16 L 24 28 L 20 25 L 16 28 L 12 25 L 8 28 L 4 25 L 0 28 Z" />
      <!-- Eyes -->
      <circle cx="7" cy="14" r="3" fill="#FFF" />
      <circle cx="9" cy="14" r="1.5" fill="#00F" />
      <circle cx="17" cy="14" r="3" fill="#FFF" />
      <circle cx="19" cy="14" r="1.5" fill="#00F" />
    </g>

    <!-- GHOST 2: PINKY (PINK) -->
    <g transform="translate(60, 16)">
      <path fill="#FFB8FF" d="M 0 16 A 12 12 0 0 1 24 16 L 24 28 L 20 25 L 16 28 L 12 25 L 8 28 L 4 25 L 0 28 Z" />
      <circle cx="7" cy="14" r="3" fill="#FFF" />
      <circle cx="9" cy="14" r="1.5" fill="#00F" />
      <circle cx="17" cy="14" r="3" fill="#FFF" />
      <circle cx="19" cy="14" r="1.5" fill="#00F" />
    </g>

    <!-- GHOST 3: INKY (CYAN / FLUTTER BLUE) -->
    <g transform="translate(10, 16)">
      <path fill="#00D2FF" d="M 0 16 A 12 12 0 0 1 24 16 L 24 28 L 20 25 L 16 28 L 12 25 L 8 28 L 4 25 L 0 28 Z" />
      <circle cx="7" cy="14" r="3" fill="#FFF" />
      <circle cx="9" cy="14" r="1.5" fill="#00F" />
      <circle cx="17" cy="14" r="3" fill="#FFF" />
      <circle cx="19" cy="14" r="1.5" fill="#00F" />
    </g>
  </g>

  <!-- GitHub Contribution Dots across the path -->
  <g fill="#39d353">
    <rect x="230" y="30" width="8" height="8" rx="2" fill="#00D2FF" opacity="0.9" />
    <rect x="280" y="30" width="8" height="8" rx="2" fill="#39d353" opacity="0.9" />
    <rect x="330" y="30" width="8" height="8" rx="2" fill="#26a641" opacity="0.9" />
    <rect x="380" y="30" width="10" height="10" rx="3" fill="#FFD700">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" repeatCount="indefinite" />
    </rect>
    <rect x="430" y="30" width="8" height="8" rx="2" fill="#006d32" opacity="0.9" />
    <rect x="480" y="30" width="8" height="8" rx="2" fill="#39d353" opacity="0.9" />
    <rect x="530" y="30" width="8" height="8" rx="2" fill="#26a641" opacity="0.9" />
    <rect x="580" y="30" width="8" height="8" rx="2" fill="#00D2FF" opacity="0.9" />
    <rect x="630" y="30" width="10" height="10" rx="3" fill="#FFD700">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" repeatCount="indefinite" />
    </rect>
    <rect x="680" y="30" width="8" height="8" rx="2" fill="#39d353" opacity="0.9" />
    <rect x="730" y="30" width="8" height="8" rx="2" fill="#26a641" opacity="0.9" />
    <rect x="780" y="30" width="8" height="8" rx="2" fill="#006d32" opacity="0.9" />
  </g>
</svg>
