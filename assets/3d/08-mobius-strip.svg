<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="240">
  <defs>
    <linearGradient id="mbgBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080c16"/>
      <stop offset="100%" stop-color="#04060d"/>
    </linearGradient>
    <linearGradient id="infGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="infGlow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
  </defs>
  <rect width="400" height="240" rx="8" fill="url(#mbgBg)" stroke="#1e293b"/>
  <text x="14" y="22" font-family="monospace" font-size="9" font-weight="bold" fill="#10B981">[DEMO 08] 3D INFINITE MÖBIUS STRIP</text>
  <text x="315" y="22" font-family="monospace" font-size="8" fill="#10B981">● CI/CD LOOP</text>
  <line x1="14" y1="30" x2="386" y2="30" stroke="#1e293b"/>

  <!-- Infinity / Mobius Loop Path -->
  <path d="M 130 135 C 130 100, 80 100, 80 135 C 80 170, 130 170, 200 135 C 270 100, 320 100, 320 135 C 320 170, 270 170, 200 135 Z" 
        fill="none" stroke="url(#infGrad)" stroke-width="7" stroke-linecap="round" opacity="0.85" filter="url(#infGlow)"/>

  <!-- Energy Beam traveling around infinity loop -->
  <circle r="4" fill="#ffffff" filter="url(#infGlow)">
    <animateMotion path="M 130 135 C 130 100, 80 100, 80 135 C 80 170, 130 170, 200 135 C 270 100, 320 100, 320 135 C 320 170, 270 170, 200 135 Z" 
                   dur="3.5s" repeatCount="indefinite" />
  </circle>

  <!-- Stage labels -->
  <text x="80" y="139" font-family="sans-serif" font-size="7" font-weight="bold" fill="#ffffff" text-anchor="middle">CODE</text>
  <text x="320" y="139" font-family="sans-serif" font-size="7" font-weight="bold" fill="#ffffff" text-anchor="middle">DEPLOY</text>
  <text x="200" y="210" font-family="monospace" font-size="8" fill="#64748b" text-anchor="middle">PLAN ➔ BUILD ➔ TEST ➔ RELEASE (REPEAT)</text>
</svg>