<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 6" width="100%" height="6">
  <defs>
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="0%" spreadMethod="repeat">
      <stop offset="0%" stop-color="#0175C2" stop-opacity="0.2" />
      <stop offset="20%" stop-color="#0175C2" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#00D2FF" stop-opacity="1" />
      <stop offset="50%" stop-color="#7B2CBF" stop-opacity="1" />
      <stop offset="60%" stop-color="#00D2FF" stop-opacity="1" />
      <stop offset="80%" stop-color="#02569B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0175C2" stop-opacity="0.2" />
      <animate attributeName="x1" from="0%" to="100%" dur="5s" repeatCount="indefinite" />
      <animate attributeName="x2" from="100%" to="200%" dur="5s" repeatCount="indefinite" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect x="0" y="1" width="1200" height="4" rx="2" fill="url(#neonGradient)" filter="url(#glow)" />
</svg>
