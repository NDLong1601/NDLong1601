      <stop offset="0%" stop-color="#080c16"/>
      <stop offset="100%" stop-color="#04060d"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" rx="8" fill="url(#wpBg)" stroke="#1e293b"/>
