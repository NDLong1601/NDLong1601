<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="240">
  <defs>
    <linearGradient id="gyBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080c16"/>
      <stop offset="100%" stop-color="#04060d"/>
    </linearGradient>
    <filter id="gyGlow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
  </defs>
  <rect width="400" height="240" rx="8" fill="url(#gyBg)" stroke="#1e293b"/>
  <text x="14" y="22" font-family="monospace" font-size="9" font-weight="bold" fill="#A855F7">[DEMO 03] 3D MULTI-AXIS GYROSCOPE</text>
  <text x="315" y="22" font-family="monospace" font-size="8" fill="#EC4899">● REACTOR</text>
  <line x1="14" y1="30" x2="386" y2="30" stroke="#1e293b"/>

  <!-- Ring 1: Outer Yaw (Cyan) -->
  <ellipse cx="200" cy="135" rx="65" ry="65" fill="none" stroke="#00E5FF" stroke-width="1.8" stroke-dasharray="8,6" opacity="0.8">
    <animateTransform attributeName="transform" type="rotate" from="0 200 135" to="360 200 135" dur="8s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Ring 2: Pitch (Magenta) -->
  <ellipse cx="200" cy="135" rx="50" ry="20" fill="none" stroke="#EC4899" stroke-width="1.8" opacity="0.8">
    <animate attributeName="ry" values="50;5;50;5;50" dur="4s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" from="45 200 135" to="405 200 135" dur="6s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Ring 3: Roll (Violet) -->
  <ellipse cx="200" cy="135" rx="20" ry="38" fill="none" stroke="#A855F7" stroke-width="1.8" opacity="0.9">
    <animate attributeName="rx" values="38;5;38;5;38" dur="3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" from="-45 200 135" to="315 200 135" dur="5s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Center Core Pulsing Energy -->
  <circle cx="200" cy="135" r="12" fill="#00E5FF" filter="url(#gyGlow)">
    <animate attributeName="r" values="9;15;9" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="200" y="139" font-family="sans-serif" font-size="10" font-weight="900" fill="#080c16" text-anchor="middle">NDL</text>
</svg>