<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 680" width="320" height="604" fill="none">
  <defs>
    <!-- Metallic phone border gradient -->
    <linearGradient id="phoneBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="30%" stop-color="#1e293b" />
      <stop offset="70%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Glowing laser gradient for biometric scanner -->
    <linearGradient id="laserGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0" />
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="1" />
      <stop offset="100%" stop-color="#0175C2" stop-opacity="0" />
    </linearGradient>

    <!-- Flutter Blue Gradient -->
    <linearGradient id="flutterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02569B" />
      <stop offset="100%" stop-color="#0175C2" />
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <!-- PHONE CHASSIS -->
  <rect x="5" y="5" width="350" height="670" rx="46" fill="#090d16" stroke="url(#phoneBorder)" stroke-width="4" />
  <!-- Inner Bezel -->
  <rect x="12" y="12" width="336" height="656" rx="40" fill="#030712" />

  <!-- DYNAMIC ISLAND / TOP NOTCH -->
  <rect x="130" y="22" width="100" height="24" rx="12" fill="#000" />
  <circle cx="215" cy="34" r="5" fill="#111827" />
  <circle cx="216" cy="35" r="2" fill="#0284c7" />

  <!-- STATUS BAR -->
  <text x="36" y="38" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="600">9:41</text>
  <g transform="translate(300, 28)" fill="#94a3b8">
    <!-- Battery -->
    <rect x="0" y="2" width="20" height="10" rx="3" fill="none" stroke="#94a3b8" stroke-width="1.5" />
    <rect x="2" y="4" width="12" height="6" rx="1.5" fill="#10b981" />
    <rect x="21" y="5" width="2" height="4" rx="1" fill="#94a3b8" />
  </g>

  <!-- APP BAR -->
  <rect x="12" y="56" width="336" height="52" fill="url(#cardBg)" />
  <!-- Flutter Logo Bird Icon simplified -->
  <path d="M 32 75 L 44 63 L 52 63 L 36 79 Z M 44 87 L 52 87 L 44 79 L 40 83 Z M 32 91 L 40 91 L 48 83 L 44 79 Z" fill="#02569B" />
  <path d="M 40 83 L 48 75 L 44 71 L 36 79 Z" fill="#0175C2" />
  <text x="60" y="87" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="15" font-weight="700">Attendance AI Pro</text>
  <circle cx="320" cy="82" r="4" fill="#10b981">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite" />
  </circle>

  <!-- CAMERA HUD VIEWFINDER -->
  <g transform="translate(32, 126)">
    <!-- Scanner frame background -->
    <rect x="0" y="0" width="296" height="260" rx="20" fill="#0b1329" stroke="#1e3a8a" stroke-width="1.5" stroke-dasharray="4,4" />
    
    <!-- Target Brackets Corners -->
    <path d="M 20 50 L 20 20 L 50 20" stroke="#00D2FF" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M 246 20 L 276 20 L 276 50" stroke="#00D2FF" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M 20 210 L 20 240 L 50 240" stroke="#00D2FF" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M 276 210 L 276 240 L 246 240" stroke="#00D2FF" stroke-width="3" fill="none" stroke-linecap="round" />

    <!-- Center Face Contour Simulation -->
    <ellipse cx="148" cy="115" rx="52" ry="68" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="6,4" fill="none" opacity="0.6" />
    <circle cx="128" cy="100" r="4" fill="#38bdf8" opacity="0.8" />
    <circle cx="168" cy="100" r="4" fill="#38bdf8" opacity="0.8" />
    <path d="M 148 110 L 148 128 L 142 128" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.8" />
    <path d="M 132 148 Q 148 160 164 148" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.8" />

    <!-- Pulsing target crosshair -->
    <circle cx="148" cy="115" r="75" stroke="#00E5FF" stroke-width="1" fill="none" opacity="0.3">
      <animate attributeName="r" values="70;82;70" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="2s" repeatCount="indefinite" />
    </circle>

    <!-- MOVING BIOMETRIC SCAN LASER -->
    <g>
      <line x1="10" y1="30" x2="286" y2="30" stroke="url(#laserGlow)" stroke-width="3">
        <animate attributeName="y1" values="30;230;30" dur="2.4s" repeatCount="indefinite" />
        <animate attributeName="y2" values="30;230;30" dur="2.4s" repeatCount="indefinite" />
      </line>
      <rect x="10" y="20" width="276" height="20" fill="url(#laserGlow)" opacity="0.15">
        <animate attributeName="y" values="20;220;20" dur="2.4s" repeatCount="indefinite" />
      </rect>
    </g>

    <!-- Status pill inside camera -->
    <rect x="78" y="218" width="140" height="26" rx="13" fill="#030712" stroke="#0284c7" stroke-width="1" />
    <text x="148" y="235" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="700" text-anchor="middle">BIOMETRIC SCANNING</text>
  </g>

  <!-- VERIFICATION CARD (SUCCESS RESULT) -->
  <g transform="translate(32, 404)">
    <rect x="0" y="0" width="296" height="96" rx="16" fill="url(#cardBg)" stroke="#10b981" stroke-width="1.5" />
    <!-- Checkmark Icon -->
    <circle cx="36" cy="38" r="16" fill="#064e3b" />
    <path d="M 28 38 L 34 44 L 45 32" stroke="#10b981" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    
    <text x="64" y="34" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="14" font-weight="700">Nguyễn Đức Long</text>
    <text x="64" y="52" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11">Lead Mobile Engineer</text>
    <line x1="64" y1="62" x2="276" y2="62" stroke="#334155" stroke-width="1" />
    <text x="64" y="80" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="600">✓ Match: 99.8% • Check-in: 08:30 AM</text>
  </g>

  <!-- QUICK STATS TILES -->
  <g transform="translate(32, 514)">
    <rect x="0" y="0" width="140" height="60" rx="12" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1" />
    <text x="16" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11">Architecture</text>
    <text x="16" y="46" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="700">Clean / BLoC</text>

    <rect x="156" y="0" width="140" height="60" rx="12" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1" />
    <text x="172" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11">AI Engine</text>
    <text x="172" y="46" fill="#a855f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="700">OpenCV + ORB</text>
  </g>

  <!-- BOTTOM NAVIGATION BAR -->
  <g transform="translate(12, 592)">
    <rect x="0" y="0" width="336" height="56" fill="#090d16" stroke="#1e293b" stroke-width="1" />
    <!-- Nav Icons -->
    <circle cx="56" cy="24" r="3" fill="#64748b" />
    <circle cx="120" cy="24" r="3" fill="#00D2FF" />
    <circle cx="120" cy="34" r="2" fill="#00D2FF" />
    <circle cx="216" cy="24" r="3" fill="#64748b" />
    <circle cx="280" cy="24" r="3" fill="#64748b" />
    
    <!-- Home Bar Indicator -->
    <rect x="118" y="58" width="100" height="4" rx="2" fill="#475569" />
  </g>
</svg>
