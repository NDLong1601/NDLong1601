<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 310" width="100%" height="310">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="crystBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="50%" stop-color="#0a1024"/>
      <stop offset="100%" stop-color="#04060f"/>
    </linearGradient>

    <!-- Top Neon Accent -->
    <linearGradient id="crystAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="35%" stop-color="#38BDF8"/>
      <stop offset="70%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <!-- Chrome Prism Gradients for Facets -->
    <linearGradient id="facet1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <linearGradient id="facet2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <linearGradient id="facet3" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="60%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <linearGradient id="facetPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="50%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#831843"/>
    </linearGradient>

    <!-- Shimmer Glare -->
    <linearGradient id="crystShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animate attributeName="x1" values="-100%;200%" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;300%" dur="2.8s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="crystGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .cr-frame { fill: url(#crystBg); stroke: #1e293b; stroke-width: 1.5; }
    .hud-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace; font-size: 10px; font-weight: 800; letter-spacing: 1.2px; }
    .hud-sub { font-family: monospace; font-size: 9px; font-weight: 700; fill: #64748b; }
    .panel-header { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace; font-size: 9.5px; font-weight: 800; letter-spacing: 1px; }
    .panel-label { font-family: monospace; font-size: 8.5px; fill: #64748b; }
    .panel-val { font-family: monospace; font-size: 9px; font-weight: 700; fill: #f8fafc; }
  </style>

  <!-- Frame Background -->
  <rect class="cr-frame" x="2" y="2" width="846" height="306" rx="12" />

  <!-- Top Accent Strip -->
  <rect x="20" y="2" width="810" height="2" fill="url(#crystAccent)" rx="1" filter="url(#crystGlow)" />

  <!-- HUD Header -->
  <g transform="translate(24, 20)">
    <circle cx="0" cy="0" r="3.5" fill="#00E5FF">
      <animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite" />
    </circle>
    <text class="hud-title" x="12" y="3" fill="#00E5FF">[3D MODEL E] 3D CHROME CRYSTAL FLUTTER EMBLEM // RAYTRACED PBR</text>
    <text class="hud-sub" x="525" y="3">|</text>
    <text class="hud-sub" x="538" y="3" fill="#EC4899">PRISMATIC CAUSTICS: 60FPS</text>

    <!-- Right Header -->
    <text class="hud-sub" x="650" y="3">MATERIAL: <tspan fill="#38BDF8">CHROME GLASS</tspan></text>
    <text class="hud-sub" x="765" y="3">|</text>
    <text class="hud-sub" x="778" y="3" fill="#10B981">● 4K PBR</text>
  </g>

  <!-- ==================== LEFT PANEL: OPTICAL & MATERIAL PHYSICS ==================== -->
  <g transform="translate(24, 46)">
    <rect x="0" y="0" width="200" height="245" rx="8" fill="#080d1d" stroke="#1e293b" stroke-width="1.2" />
    <rect x="10" y="10" width="180" height="22" rx="4" fill="#0c1833" stroke="#00E5FF" stroke-width="0.8" />
    <text class="panel-header" x="18" y="25" fill="#00E5FF">💎 PBR MATERIAL SPECS</text>

    <g transform="translate(14, 52)">
      <text class="panel-label" x="0" y="0">REFRACTION INDEX (IOR)</text>
      <text class="panel-val" x="0" y="14" fill="#38BDF8">2.417 (Diamond Optical)</text>

      <text class="panel-label" x="0" y="36">CHROMATIC DISPERSION</text>
      <text class="panel-val" x="0" y="50" fill="#EC4899">0.044 (Spectral Rainbow)</text>

      <text class="panel-label" x="0" y="72">SURFACE POLISH</text>
      <text class="panel-val" x="0" y="86" fill="#10B981">100% Mirror Chrome</text>

      <text class="panel-label" x="0" y="108">CAUSTIC PROJECTION</text>
      <text class="panel-val" x="0" y="122" fill="#818CF8">Volumetric Neon Raytrace</text>

      <text class="panel-label" x="0" y="144">GEOMETRY RESOLUTION</text>
      <text class="panel-val" x="0" y="158" fill="#FBBF24">64 Faceted Crystal Polys</text>
    </g>

    <line x1="12" y1="228" x2="188" y2="228" stroke="#1e293b" stroke-width="1" />
    <text class="panel-label" x="14" y="240" fill="#64748b">RENDER PASS: <tspan fill="#10B981">GLOSS RAYTRACED</tspan></text>
  </g>

  <!-- ==================== CENTER: 3D PRISMATIC FLUTTER CRYSTAL ==================== -->
  <g class="crystal-3d" transform="translate(425, 155)">
    <!-- Hovering Animation -->
    <animateTransform attributeName="transform" type="translate" values="425 147; 425 163; 425 147" dur="3.4s" repeatCount="indefinite"/>

    <!-- Floor Caustic Projection Shadow -->
    <ellipse cx="0" cy="85" rx="75" ry="16" fill="#000000" opacity="0.6"/>
    <ellipse cx="0" cy="85" rx="55" ry="10" fill="#00E5FF" opacity="0.15" filter="url(#crystGlow)"/>

    <!-- Tilted 3D Orbiting Prismatic Light Ring -->
    <ellipse cx="0" cy="0" rx="100" ry="34" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="8,6" opacity="0.5" transform="rotate(-18 0 0)"/>

    <!-- ==================== FLUTTER 3D CRYSTAL MESH ==================== -->
    <!-- Top Wing (Upper Diamond) -->
    <!-- Facet 1A (Top Left Front) -->
    <polygon points="0,-65 -45,-20 0,-10" fill="url(#facet1)" stroke="#ffffff" stroke-width="0.8"/>
    <!-- Facet 1B (Top Right Front) -->
    <polygon points="0,-65 45,-20 0,-10" fill="url(#facet2)" stroke="#ffffff" stroke-width="0.8"/>
    <!-- Facet 1C (Top Center Ridge) -->
    <polygon points="0,-65 15,-15 0,-10 -15,-15" fill="#ffffff" opacity="0.3"/>

    <!-- Lower Wing (Lower Prismatic Chevron) -->
    <!-- Facet 2A (Left Lower) -->
    <polygon points="-45,-20 0,25 -25,45 -65,5" fill="url(#facet3)" stroke="#818CF8" stroke-width="0.8"/>
    <!-- Facet 2B (Center Bottom Diamond) -->
    <polygon points="0,25 45,70 15,85 -25,45" fill="url(#facet1)" stroke="#00E5FF" stroke-width="1"/>
    <!-- Facet 2C (Right Lower Wing) -->
    <polygon points="0,25 55,25 80,50 45,70" fill="url(#facetPink)" stroke="#EC4899" stroke-width="0.8"/>

    <!-- Specular Light Glint Beam traversing the Crystal -->
    <polygon points="0,-65 -45,-20 0,25 45,70" fill="url(#crystShimmer)" opacity="0.6"/>

    <!-- Sparkling Diamond Star Flares -->
    <!-- Top Star -->
    <g transform="translate(0, -65)">
      <circle cx="0" cy="0" r="4" fill="#ffffff" filter="url(#crystGlow)">
        <animate attributeName="r" values="3;6;3" dur="1.4s" repeatCount="indefinite"/>
      </circle>
      <polygon points="0,-12 3,0 0,12 -3,0" fill="#ffffff"/>
      <polygon points="-12,0 0,3 12,0 0,-3" fill="#ffffff"/>
    </g>

    <!-- Bottom Star -->
    <g transform="translate(45, 70)">
      <circle cx="0" cy="0" r="3" fill="#00E5FF" filter="url(#crystGlow)">
        <animate attributeName="r" values="2;5;2" dur="1.8s" begin="0.6s" repeatCount="indefinite"/>
      </circle>
      <polygon points="0,-9 2,0 0,9 -2,0" fill="#00E5FF"/>
      <polygon points="-9,0 0,2 9,0 0,-2" fill="#00E5FF"/>
    </g>

    <text x="0" y="108" font-family="monospace" font-size="8.5" font-weight="900" fill="#00E5FF" text-anchor="middle" letter-spacing="1">PRISMATIC FLUTTER 3D CORE</text>
  </g>

  <!-- ==================== RIGHT PANEL: GPU PIPELINE ==================== -->
  <g transform="translate(626, 46)">
    <rect x="0" y="0" width="200" height="245" rx="8" fill="#080d1d" stroke="#1e293b" stroke-width="1.2" />
    <rect x="10" y="10" width="180" height="22" rx="4" fill="#180e2b" stroke="#EC4899" stroke-width="0.8" />
    <text class="panel-header" x="18" y="25" fill="#EC4899">🚀 IMPELLER GPU ENGINE</text>

    <g transform="translate(14, 52)">
      <text class="panel-label" x="0" y="0">GRAPHICS BACKEND</text>
      <text class="panel-val" x="0" y="14" fill="#38BDF8">Vulkan (Android) • Metal (iOS)</text>

      <text class="panel-label" x="0" y="36">SHADER COMPILATION</text>
      <text class="panel-val" x="0" y="50" fill="#10B981">Ahead-Of-Time (Zero Jank)</text>

      <text class="panel-label" x="0" y="72">TEXTURE CACHE</text>
      <text class="panel-val" x="0" y="86" fill="#818CF8">64-bit HDR Color Space</text>

      <text class="panel-label" x="0" y="108">GPU UTILIZATION</text>
      <text class="panel-val" x="0" y="122" fill="#F472B6">18.5% (High Efficiency)</text>

      <text class="panel-label" x="0" y="144">TARGET REFRESH RATE</text>
      <text class="panel-val" x="0" y="158" fill="#FBBF24">120Hz ProMotion Display</text>
    </g>

    <line x1="12" y1="228" x2="188" y2="228" stroke="#1e293b" stroke-width="1" />
    <text class="panel-label" x="14" y="240" fill="#64748b">STATUS: <tspan fill="#10B981">HARDWARE ACCELERATED</tspan></text>
  </g>
</svg>