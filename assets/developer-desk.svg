<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 250" width="100%" height="auto" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="deskBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a" />
      <stop offset="50%" stop-color="#0b1326" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="deskBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#00D2FF" stop-opacity="0.8" />
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="subCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0.95" />
    </linearGradient>

    <style>
      .code-font {
        font-family: 'Consolas', 'Courier New', Monaco, monospace;
      }
      .cursor {
        animation: blink 0.9s infinite;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- MAIN CONTAINER FRAME -->
  <rect x="10" y="8" width="900" height="234" rx="16" fill="url(#deskBg)" stroke="url(#deskBorder)" stroke-width="2" />

  <!-- WINDOW HEADER BAR -->
  <rect x="10" y="8" width="900" height="34" rx="16" fill="#0b1329" />
  <rect x="10" y="26" width="900" height="16" fill="#0b1329" />
  <line x1="10" y1="42" x2="910" y2="42" stroke="#1e293b" stroke-width="1.5" />

  <!-- WINDOW CONTROLS (macOS Dots) -->
  <circle cx="34" cy="25" r="5.5" fill="#EF4444" />
  <circle cx="52" cy="25" r="5.5" fill="#F59E0B" />
  <circle cx="70" cy="25" r="5.5" fill="#10B981" />

  <!-- WINDOW TITLE -->
  <text x="460" y="29" fill="#94A3B8" class="code-font" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.5">
    ⚡ NDLONG-WORKSPACE :: FLUTTER_ENVIRONMENT [ACTIVE]
  </text>
  
  <!-- LIVE STATUS PILL -->
  <g transform="translate(815, 17)">
    <circle cx="8" cy="8" r="4" fill="#10B981">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite" />
    </circle>
    <text x="18" y="12" fill="#10B981" class="code-font" font-size="11" font-weight="700">LIVE</text>
  </g>

  <!-- ================= LEFT COLUMN: TERMINAL LOG ================= -->
  <g transform="translate(28, 56)">
    <!-- Terminal Box -->
    <rect x="0" y="0" width="280" height="170" rx="10" fill="url(#subCard)" stroke="#1e293b" stroke-width="1.2" />
    
    <!-- Terminal Header Tab -->
    <rect x="0" y="0" width="280" height="26" rx="10" fill="#0f172a" />
    <rect x="0" y="16" width="280" height="10" fill="#0f172a" />
    <text x="14" y="18" fill="#64748B" class="code-font" font-size="10" font-weight="700">TERMINAL // bash</text>

    <!-- Code Logs -->
    <g class="code-font" font-size="11" font-weight="600">
      <text x="14" y="48" fill="#38BDF8">$ flutter run --release</text>
      <text x="14" y="68" fill="#10B981">✓ Clean Architecture [OK]</text>
      <text x="14" y="88" fill="#10B981">✓ State Management: BLoC</text>
      <text x="14" y="108" fill="#A855F7">✓ Biometric AI Engine [ON]</text>
      <text x="14" y="128" fill="#F59E0B">⚡ UI Polish: 60 FPS Smooth</text>
      <text x="14" y="148" fill="#00D2FF">&gt; Ready for deployment <tspan fill="#00D2FF" class="cursor">█</tspan></text>
    </g>
  </g>

  <!-- ================= CENTER COLUMN: ANIMATED BONGO CAT WORKSTATION ================= -->
  <g transform="translate(328, 56)">
    <!-- Center Desk Box -->
    <rect x="0" y="0" width="264" height="170" rx="10" fill="url(#subCard)" stroke="#1e3a8a" stroke-width="1.2" />
    
    <!-- Desk Ambient Glow Line -->
    <line x1="12" y1="124" x2="252" y2="124" stroke="#0284c7" stroke-width="2" opacity="0.6" />

    <!-- BONGO CAT BODY -->
    <!-- Cat Head & Ears -->
    <path d="M 82 118 C 76 90 94 65 132 65 C 170 65 188 90 182 118 Z" fill="#F8FAFC" stroke="#0F172A" stroke-width="3" />
    <!-- Left Ear -->
    <polygon points="90,75 75,44 112,66" fill="#F8FAFC" stroke="#0F172A" stroke-width="3" stroke-linejoin="round" />
    <polygon points="91,72 82,53 106,66" fill="#FDA4AF" />
    <!-- Right Ear -->
    <polygon points="174,75 189,44 152,66" fill="#F8FAFC" stroke="#0F172A" stroke-width="3" stroke-linejoin="round" />
    <polygon points="173,72 182,53 158,66" fill="#FDA4AF" />

    <!-- Cat Eyes -->
    <circle cx="112" cy="85" r="4.5" fill="#0F172A" />
    <circle cx="152" cy="85" r="4.5" fill="#0F172A" />
    <!-- Eye Highlights -->
    <circle cx="110.5" cy="83.5" r="1.5" fill="#FFF" />
    <circle cx="150.5" cy="83.5" r="1.5" fill="#FFF" />

    <!-- Cute Cat Mouth -->
    <path d="M 125 93 Q 132 98 139 93" stroke="#0F172A" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <path d="M 118 93 Q 125 98 132 93" stroke="#0F172A" stroke-width="2.5" fill="none" stroke-linecap="round" />

    <!-- Blushing Cheeks -->
    <ellipse cx="102" cy="94" rx="5" ry="3" fill="#FDA4AF" opacity="0.8" />
    <ellipse cx="162" cy="94" rx="5" ry="3" fill="#FDA4AF" opacity="0.8" />

    <!-- MECHANICAL KEYBOARD -->
    <g transform="translate(62, 120)">
      <!-- Keyboard Base -->
      <rect x="0" y="0" width="140" height="34" rx="5" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5" />
      
      <!-- Key Switches (Row 1) -->
      <rect x="8" y="5" width="18" height="10" rx="2" fill="#1E293B" />
      <rect x="30" y="5" width="18" height="10" rx="2" fill="#1E293B" />
      <rect x="52" y="5" width="18" height="10" rx="2" fill="#1E293B" />
      <rect x="74" y="5" width="18" height="10" rx="2" fill="#1E293B" />
      <rect x="96" y="5" width="18" height="10" rx="2" fill="#1E293B" />
      <rect x="118" y="5" width="14" height="10" rx="2" fill="#1E293B" />

      <!-- Spacebar & Lower Keys -->
      <rect x="8" y="19" width="24" height="10" rx="2" fill="#1E293B" />
      <!-- Animated Spacebar Glow -->
      <rect x="36" y="19" width="68" height="10" rx="2" fill="#0284C7">
        <animate attributeName="fill" values="#0284C7;#00D2FF;#6366F1;#0284C7" dur="1.5s" repeatCount="indefinite" />
      </rect>
      <rect x="108" y="19" width="24" height="10" rx="2" fill="#1E293B" />
    </g>

    <!-- ALTERNATING TYPING PAWS -->
    <!-- Left Paw (Types down while right paw is up) -->
    <g>
      <ellipse cx="88" cy="120" rx="14" ry="11" fill="#F8FAFC" stroke="#0F172A" stroke-width="2.5">
        <animate attributeName="cy" values="120;129;120" dur="0.25s" repeatCount="indefinite" />
      </ellipse>
      <!-- Pink Paw Pad -->
      <circle cx="88" cy="121" r="3.5" fill="#FDA4AF">
        <animate attributeName="cy" values="121;130;121" dur="0.25s" repeatCount="indefinite" />
      </circle>
    </g>

    <!-- Right Paw (Types down while left paw is up) -->
    <g>
      <ellipse cx="176" cy="129" rx="14" ry="11" fill="#F8FAFC" stroke="#0F172A" stroke-width="2.5">
        <animate attributeName="cy" values="129;120;129" dur="0.25s" repeatCount="indefinite" />
      </ellipse>
      <circle cx="176" cy="130" r="3.5" fill="#FDA4AF">
        <animate attributeName="cy" values="130;121;130" dur="0.25s" repeatCount="indefinite" />
      </circle>
    </g>

    <!-- MOOD TAG -->
    <text x="132" y="162" fill="#38BDF8" class="code-font" font-size="10" font-weight="700" text-anchor="middle">
      ⌨️ CODING AT 120 WPM
    </text>
  </g>

  <!-- ================= RIGHT COLUMN: DEVELOPER VIBE HUD ================= -->
  <g transform="translate(612, 56)">
    <!-- Right Box -->
    <rect x="0" y="0" width="280" height="170" rx="10" fill="url(#subCard)" stroke="#1e293b" stroke-width="1.2" />
    
    <!-- Tab Header -->
    <rect x="0" y="0" width="280" height="26" rx="10" fill="#0f172a" />
    <rect x="0" y="16" width="280" height="10" fill="#0f172a" />
    <text x="14" y="18" fill="#64748B" class="code-font" font-size="10" font-weight="700">STATUS // VIBE CHECK</text>

    <!-- Item 1: Spotify Audio Waves -->
    <g transform="translate(16, 40)">
      <rect x="0" y="0" width="248" height="34" rx="6" fill="#022c22" stroke="#065f46" stroke-width="1" />
      <text x="12" y="21" fill="#10B981" class="code-font" font-size="11" font-weight="700">🎧 VIBING ON SPOTIFY</text>
      <!-- Equalizer bouncing bars -->
      <g transform="translate(195, 12)" fill="#10B981">
        <rect x="0" y="2" width="4" height="12" rx="1">
          <animate attributeName="height" values="12;4;14;6;12" dur="0.8s" repeatCount="indefinite" />
          <animate attributeName="y" values="2;6;1;5;2" dur="0.8s" repeatCount="indefinite" />
        </rect>
        <rect x="7" y="0" width="4" height="16" rx="1">
          <animate attributeName="height" values="16;6;12;4;16" dur="0.7s" repeatCount="indefinite" />
          <animate attributeName="y" values="0;5;2;6;0" dur="0.7s" repeatCount="indefinite" />
        </rect>
        <rect x="14" y="4" width="4" height="10" rx="1">
          <animate attributeName="height" values="10;16;6;14;10" dur="0.9s" repeatCount="indefinite" />
          <animate attributeName="y" values="4;0;5;1;4" dur="0.9s" repeatCount="indefinite" />
        </rect>
        <rect x="21" y="2" width="4" height="12" rx="1">
          <animate attributeName="height" values="12;6;16;8;12" dur="0.75s" repeatCount="indefinite" />
          <animate attributeName="y" values="2;5;0;4;2" dur="0.75s" repeatCount="indefinite" />
        </rect>
      </g>
    </g>

    <!-- Item 2: Coffee Mug with Rising Steam -->
    <g transform="translate(16, 82)">
      <rect x="0" y="0" width="248" height="34" rx="6" fill="#1e1b4b" stroke="#3730a3" stroke-width="1" />
      <text x="12" y="21" fill="#A855F7" class="code-font" font-size="11" font-weight="700">☕ FUEL: ICED COFFEE</text>
      <text x="195" y="21" fill="#C084FC" class="code-font" font-size="11" font-weight="700">100%</text>
    </g>

    <!-- Item 3: Current Focus -->
    <g transform="translate(16, 124)">
      <rect x="0" y="0" width="248" height="34" rx="6" fill="#082f49" stroke="#0369a1" stroke-width="1" />
      <text x="12" y="21" fill="#38BDF8" class="code-font" font-size="11" font-weight="700">🎯 FOCUS: FLUTTER &amp; AI</text>
      <text x="190" y="21" fill="#38BDF8" class="code-font" font-size="11" font-weight="700">⚡ FAST</text>
    </g>
  </g>
</svg>
